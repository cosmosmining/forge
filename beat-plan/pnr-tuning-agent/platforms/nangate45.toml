# Nangate45 / FreePDK45 platform, as shipped in OpenROAD's test/Nangate45 directory.
# PNR_PLATFORM_DIR must point at that directory (scripts/env.sh sets it).
# Values mirror OpenROAD's test/Nangate45/Nangate45.vars so the baseline recipe
# reproduces OpenROAD's reference flow.
[platform]
name = "nangate45"
dir = "${PNR_PLATFORM_DIR}"
tech_lef = "Nangate45_tech.lef"
std_cell_lef = "Nangate45_stdcell.lef"
liberty = "Nangate45_typ.lib"
site = "FreePDK45_38x28_10R_NP_162NW_34O"
pdn_cfg = "Nangate45.pdn.tcl"
tracks = "Nangate45.tracks"
layer_rc = "Nangate45.rc"
rcx_rules = "Nangate45.rcx_rules"
io_hor_layer = "metal3"
io_ver_layer = "metal2"
tapcell_args = "-distance 120 -tapcell_master TAPCELL_X1 -endcap_master TAPCELL_X1"
tielo_port = "LOGIC0_X1/Z"
tiehi_port = "LOGIC1_X1/Z"
dont_use = ["CLKBUF_*", "AOI211_X1", "OAI211_X1"]
filler_cells = "FILLCELL*"
min_routing_layer = "metal2"
max_routing_layer = "metal10"
signal_layers = "metal2-metal10"
clock_layers = "metal6-metal10"
macro_halo = [22.4, 15.12]
tie_separation = 5
