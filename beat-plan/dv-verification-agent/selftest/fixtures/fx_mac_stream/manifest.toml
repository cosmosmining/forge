# DV-agent self-test fixture (NOT Forge RTL, NOT Build 6).
[block]
name = "fx_mac_stream"
top = "fx_mac_stream"
rtl = ["rtl/fx_mac_stream.sv"]

[interface]
protocol = "stream"
clock = "clk"
reset = "rst_n"
reset_active_low = true
in_valid = "in_valid"
in_ready = "in_ready"
out_valid = "out_valid"
out_ready = "out_ready"
in_last = "in_last"

[golden]
model = "golden.py:mac"
style = "stream"

[stimulus]
packets = 200
max_packet = 16
